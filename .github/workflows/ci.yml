name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-commits:
    name: Lint Commits
    # Renovate branches carry generated commits (e.g. onboarding
    # "Add renovate.json") that fail conventional lint; skip them.
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    # Inline job, not the aptu-dev/.github reusable workflow: this repo is
    # public and GitHub forbids public repos from calling reusable workflows
    # stored in private repositories (workflow resolution hard-fails).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Cache commitlint
        id: cache-commitlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: commitlint-${{ runner.arch }}-21.2.1-21.2.0
      - name: Install commitlint
        if: steps.cache-commitlint.outputs.cache-hit != 'true'
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@21.2.1 \
            @commitlint/config-conventional@21.2.0
      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Security - Secret scanning
        run: |
          BL_VERSION=1.9.0
          ARCH=$(echo "$RUNNER_ARCH" | tr 'A-Z' 'a-z')
          case "$ARCH" in
            x64|arm64) ;;
            *) echo "unsupported runner arch: $ARCH"; exit 1 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/checksums.txt"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt.sigstore.json" "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/checksums.txt.sigstore.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/checksums.txt.sigstore.json" --certificate-identity "https://github.com/betterleaks/betterleaks/.github/workflows/release.yml@refs/tags/v${BL_VERSION}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$RUNNER_TEMP/checksums.txt"
          SHA256=$(awk -v f="betterleaks_${BL_VERSION}_linux_${ARCH}.tar.gz" '$2 == f { print $1 }' "$RUNNER_TEMP/checksums.txt")
          if [ -z "$SHA256" ] || [ "$(printf '%s\n' "$SHA256" | wc -l)" -ne 1 ]; then
            echo "expected exactly one sha256 for betterleaks_${BL_VERSION}_linux_${ARCH}.tar.gz in verified checksums.txt"
            exit 1
          fi
          curl -sSfL -o "$RUNNER_TEMP/betterleaks.tar.gz" "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/betterleaks_${BL_VERSION}_linux_${ARCH}.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          VERSION=$($RUNNER_TEMP/betterleaks version)
          [ "$VERSION" = "$BL_VERSION" ] || { echo "unexpected betterleaks version: $VERSION"; exit 1; }
          echo "betterleaks $VERSION"
          "$RUNNER_TEMP/betterleaks" git . -v --redact


  check:
    name: Check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-arm64-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  # Aggregate status check: add language-specific jobs (lint, test, build)
  # to the needs array as the repo grows; the ruleset keeps requiring only
  # this one check.
  ci-result:
    name: CI Result
    runs-on: ubuntu-26.04-arm
    needs: [lint-commits, secret-scan, check]
    if: always()
    permissions: {}
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
